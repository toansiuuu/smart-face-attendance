spring.application.name=smart-face-attendance
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/smart_face_attendance?connectionTimeZone=%2B07:00&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/password-reset.sql
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
app.zone=Asia/Ho_Chi_Minh
# Unconfirmed rules: reports explicitly show policyConfigured=false until weekdays are supplied.
app.working-days=${WORKING_DAYS:}
app.grace-minutes=${GRACE_MINUTES:0}
app.recognition-url=${RECOGNITION_URL:}
app.recognition-secret=${RECOGNITION_SECRET:}
app.liveness-url=${LIVENESS_URL:http://localhost:8001}
app.liveness-secret=${LIVENESS_SECRET:}
app.upload-dir=${UPLOAD_DIR:uploads}
server.tomcat.max-http-form-post-size=3MB

# Authentication is handled by AuthController using the existing user_accounts table.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Password recovery: both delivery channels stay disabled until configured.
recovery.mail.host=${MAIL_HOST:}
recovery.mail.port=${MAIL_PORT:587}
recovery.mail.username=${MAIL_USERNAME:}
recovery.mail.password=${MAIL_PASSWORD:}
recovery.mail.from=${MAIL_FROM:}
recovery.mail.auth=${MAIL_AUTH:true}
recovery.mail.starttls=${MAIL_STARTTLS:true}
recovery.twilio.sid=${TWILIO_ACCOUNT_SID:}
recovery.twilio.token=${TWILIO_AUTH_TOKEN:}
recovery.twilio.from=${TWILIO_FROM_NUMBER:}
recovery.phone-country-code=${RECOVERY_PHONE_COUNTRY_CODE:84}
recovery.admin.username=${RECOVERY_ADMIN_USERNAME:admin}
recovery.admin.email=${RECOVERY_ADMIN_EMAIL:}
recovery.admin.phone=${RECOVERY_ADMIN_PHONE:}
